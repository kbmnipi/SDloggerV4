; SDloggerV4 — вибрологгер BMI160 (WeAct STM32F405RGT6 Core Board)
; См. Docs/01_hardware_and_build.md (раздел 4 — грабли HAL 1.28.3)

[common]
platform = ststm32@19.1.0
board = genericSTM32F405RG
framework = stm32cube

; 84 МГц постоянно (динамическое переключение частоты запрещено — сбивается SDIO)
board_build.f_cpu = 84000000L

; PlatformIO молча подменяет -O2 на -Os, если не снять -Os
build_unflags = -Os

build_flags =
    -DHSE_VALUE=8000000
    -fstack-usage
    -Wl,-Map=${BUILD_DIR}/firmware.map

extra_scripts = pre:scripts/link_layout.py

[env:release]
extends = common
build_flags = ${common.build_flags} -O2

[env:debug]
extends = common
build_flags = ${common.build_flags} -Og -g3
