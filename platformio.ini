; SDloggerV4 — вибрологгер BMI160 (WeAct STM32F405RGT6 Core Board)
; См. Docs/01_hardware_and_build.md (раздел 4 — грабли HAL 1.28.3)

[common]
platform = ststm32@19.1.0
board = genericSTM32F405RG
framework = stm32cube

; SWD-загрузка и отладка через MiniDebugger/ST-Link. В genericSTM32F405RG
; протокол по умолчанию — "serial", а UART-загрузчик в прошивке не
; записан (BOOT0 на плате не выведен), поэтому без этой строки
; `pio run -t upload` падает. Монитор MiniDebugger'а — 115200 (Docs/01 §2).
upload_protocol = stlink
debug_tool = stlink
monitor_speed = 115200

; 84 МГц постоянно (динамическое переключение частоты запрещено — сбивается SDIO)
board_build.f_cpu = 84000000L

; Свой stm32f4xx_hal_conf.h лежит в lib/ (Docs/01 §4). Без этой опции платформа
; генерирует stm32f4xx_hal_conf.h внутри пакета framework-stm32cubef4, и он же
; первым находится поиском включений — наша копия молча игнорировалась бы.
; Путь к lib/ в CPPPATH добавляет scripts/hal_config.py.
board_build.stm32cube.custom_config_header = yes

; PlatformIO молча подменяет -O2 на -Os, если не снять -Os
build_unflags = -Os

build_flags =
    -DHSE_VALUE=8000000
    -fstack-usage
    -Wl,-Map=${BUILD_DIR}/firmware.map

extra_scripts =
    pre:scripts/link_layout.py
    pre:scripts/hal_config.py

[env:release]
extends = common
build_flags = ${common.build_flags} -O2

[env:debug]
extends = common
build_flags = ${common.build_flags} -Og -g3
